name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Check backend project exists
        id: backend
        shell: bash
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Backend scaffold is not present yet; CI will run repository-level checks only."
          fi

      - name: Install backend dependencies
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]"
          fi

      - name: Run Ruff
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          if python -c "import ruff" 2>/dev/null; then
            ruff check .
            ruff format --check .
          else
            echo "Ruff is not installed; add it to backend development dependencies."
            exit 1
          fi

      - name: Run type checks
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          if python -c "import mypy" 2>/dev/null; then
            mypy app
          else
            echo "mypy is not installed; add it to backend development dependencies."
            exit 1
          fi

      - name: Run tests
        if: steps.backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          if python -c "import pytest" 2>/dev/null; then
            pytest -q
          else
            echo "pytest is not installed; add it to backend development dependencies."
            exit 1
          fi
