# CodeRabbit repository configuration
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Review for correctness, maintainability, Python typing, focused responsibilities
        and pragmatic SOLID design. Do not recommend interfaces, factories or layers
        unless a concrete requirement justifies them. Check API validation, error
        handling, security, test coverage and database transaction behaviour.
    - path: "**/*"
      instructions: |
        Follow AI_DEVELOPMENT_GUIDELINES.md and agents.md. Prefer minimal, focused
        changes. Flag files exceeding 100 lines unless the file is a standard or
        generated file. Preserve isiXhosa text, Unicode handling, provenance and
        linguistic uncertainty. Do not present structural validity as linguistic
        correctness. Treat documentation as Markdown-only.
