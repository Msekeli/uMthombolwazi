services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umthombolwazi}
      POSTGRES_USER: ${POSTGRES_USER:-umthombolwazi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-umthombolwazi} -d ${POSTGRES_DB:-umthombolwazi}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
